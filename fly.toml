# Fly.io config. The machine stops when nobody is using the app and starts again on the
# next request (usually a few seconds). Limit orders are settled from price history on wake.
app = "papertrade-change-me"     # must be globally unique; `fly launch` can pick one
primary_region = "fra"           # Frankfurt; see `fly platform regions`

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATABASE_PATH = "/data/paper_trading.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[mounts]]
  source = "papertrade_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
